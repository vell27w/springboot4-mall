# ============================================================
#  dev —— 本机开发。日志全开、连本机的中间件。
# ============================================================
#  用这份配置跑：mvn spring-boot:run
# ============================================================

# ===== 数据源（Docker 里的 MySQL 容器 @3307）=====
#
# 【为什么是 3307 而不是 3306？】面试会问「你的环境怎么搭的」。
# 这台机器上**已经装了本机 MySQL 8.0 并占着 3306**。
# docker-compose.yml 把容器 MySQL 映射成 "3307:3306"，
# 也就是「宿主 3307 → 容器内 3306」。所以这里连 3307，
# 连的其实是**容器里**的 MySQL，本机那个 3306 根本不参与。
#
# ⚠️ 代价：**开发时必须先 `docker compose up -d`**，否则应用起不来。
#    报错长这样：Communications link failure / Connection refused。
#    这不是配置错了，是容器没起 —— 先看 `docker compose ps`。
#
# 【为什么非要连容器那个、不用本机这个？】
# 因为表结构由 `sql/schema.sql` 定义，而那份脚本**只有容器会执行**
# （挂载到 /docker-entrypoint-initdb.d，容器首次启动时跑一遍）。
# 连本机库的话，脚本改了也不会生效，会出现「新表只在容器里有、
# 应用却连本机库」→ 报 Table 'shop.xxx' doesn't exist。
#
# ⚠️ 库名 shop 是最初建库时就定下的名字，没改 —— 不影响任何面试问题，
#    别为了整齐去动它。
# serverTimezone 必须写：不写会按 UTC 解释时间，
# 于是 create_time 存进去是北京时间、读出来差 8 小时。
spring.datasource.url=jdbc:mysql://localhost:3307/shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Redis =====
# 这是后面加缓存时用的。**现在 Redis 还没跑起来也不要紧** ——
# Lettuce 是懒连接，只有第一次真正读写时才建连接，所以应用照常启动。
# 但 /actuator/health 会报 Redis DOWN，那是正常的，等 Docker 起来就好。
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===== RabbitMQ =====
# 同理，做超时关单时才用。没起 broker 时应用能启动，但日志里会有连接重试的警告。
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ===== 日志：开发期开到最细 =====
# 打开后，每次查询都会在控制台打出真实执行的 SQL 和参数。
# 走的是 SLF4J（日志框架），不是 System.out，所以能按级别关掉。
logging.level.com.vell27w.mall.mapper=debug
logging.level.com.vell27w.mall=debug

# ===== 接口文档：开发期全开 =====
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

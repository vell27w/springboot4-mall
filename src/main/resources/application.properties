# ============================================================
#  主配置 —— 只放「所有环境都一样」的东西
# ============================================================
#  【为什么要拆成三个文件？】
#  数据库地址、日志级别、要不要开接口文档 —— 这些在开发机和线上是不一样的。
#  全塞一个文件里，改这些就得动同一份文件，很容易把调试用的设置带上线。
#
#  拆法：本文件放共用的，application-{profile}.properties 放会变的。
#  用哪个 profile 由下面的 spring.profiles.active 决定。
#
#  ⚠️ 默认写死 dev 是图方便（本项目只有一个人开发）。
#  线上启动时必须显式覆盖：java -jar mall.jar --spring.profiles.active=prod
#  忘了覆盖 = 线上跑着开发配置（SQL 全打日志、接口文档全公开）。
#  这是常见事故，面试问「多环境怎么管」时能答出来。
# ============================================================

spring.application.name=mall
spring.profiles.active=dev

# ===== MyBatis =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.vell27w.mall.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ===== Actuator =====
# 只暴露 health 和 info。默认只开 health；
# 全开（include=*）会把 env、beans、heapdump 都暴露出去 ——
# 其中 heapdump 能下载堆内存，等于把数据库密码送人。
management.endpoints.web.exposure.include=health,info
# 健康检查里带上详细信息（数据库、Redis、RabbitMQ 各自通不通）
management.endpoint.health.show-details=always

# ===== 可观测性：日志格式（含 traceId）=====
# %X{traceId} 从 MDC 里取值 —— MDC 是个 ThreadLocal<Map>，
# TraceIdFilter 往里塞，日志框架往外读。中间不需要任何库支持。
# 写法是 %X{traceId:-}，:- 后面是取不到时的默认值（这里是空串）。
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId:-..........}] %logger{36} - %msg%n

# ===== 可观测性：两个并发阀门 =====
# 这两行写出来是为了让它们"看得见"——不写也是这两个值（默认值），
# 但做并发实验时必须知道它们是多少，否则数字算不出意义。
#
# 关键：Tomcat 能同时接 200 个请求，但连接池只给 10 个数据库连接。
# 所以 20 并发打进来，真正同时压到 MySQL 的只有 10 个，其余在排队。
# 破坏实验要看的"超卖窗口"正是被这个数字卡住的 —— 池调小，超卖可能直接变 0，
# 然后你会得出"条件更新没必要"的错误结论。
server.tomcat.threads.max=200
spring.datasource.hikari.maximum-pool-size=10

# ============================================================
#  prod —— 线上。日志从简、密码从环境变量读、接口文档关掉。
# ============================================================
#  用这份配置跑：
#    java -jar target/mall-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
#
#  ⚠️ 本项目不会真上线，这份文件的作用是**让「开发/线上要分开」这件事看得见**。
#     面试问「你们多环境怎么管配置」时，答的就是这份文件里的三条：
#     密码外部化、日志降级、敏感端点关掉。
# ============================================================

# ===== 数据源 =====
# 【为什么密码不写死在文件里？】
# 这份文件是要进 git 的。写死的密码 = 密码跟着代码进版本库，
# 谁 clone 下来都能看到，离职的人也能看到，改密码还得改代码重新发版。
#
# ${DB_HOST:mysql} 的读法是：取环境变量 DB_HOST，取不到就用冒号后的默认值 mysql。
# 这个默认值正好是 docker-compose 里 MySQL 服务的名字 ——
# 容器之间可以直接用服务名当主机名，这是 Docker 自带的 DNS。
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:shop}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ===== 日志：线上只留 warn 以上 =====
# 【为什么？】
# 开发期开 debug 是为了看 SQL；线上 QPS 一上来，
# 每条 SQL 都打日志会把磁盘写满，而且日志文件大到没法查。
# 线上的排查靠 traceId 精确定位，不靠全量日志。
logging.level.root=warn
logging.level.com.vell27w.mall=info

# ===== 接口文档：线上关掉 =====
# 【为什么？】
# Swagger UI 会把所有接口、参数、返回结构摊开给任何人看，
# 等于免费送一份接口清单。要么关掉，要么加鉴权。
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===== Actuator：线上收得更紧 =====
# 继承主配置的 health,info，这里不再放开更多。
management.endpoint.health.show-details=never
